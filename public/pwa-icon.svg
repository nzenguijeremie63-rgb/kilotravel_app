<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Navy -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#0b101c" />
    </linearGradient>

    <!-- Accent Gradient: Warm Coral to Orange -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a59" />
      <stop offset="100%" stop-color="#f04e23" />
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer subtle circular ring -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2" fill="none" />

  <!-- 3D Stylized Delivery Box (Package) -->
  <g transform="translate(0, 10)">
    <!-- Top Face -->
    <polygon points="256,120 376,184 256,248 136,184" fill="#ff7a59" />

    <!-- Left Face -->
    <polygon points="136,184 256,248 256,368 136,304" fill="#d9431b" />

    <!-- Right Face -->
    <polygon points="256,248 376,184 376,304 256,368" fill="#eb582f" />

    <!-- Box Tape / Ribbon Highlight -->
    <polygon points="256,120 286,136 256,152 226,136" fill="#ffe2db" opacity="0.6" />
    <polygon points="256,184 286,200 256,216 226,200" fill="#ffe2db" opacity="0.6" />

    <!-- Dynamic Plane Orbiting / Crossing -->
    <g transform="translate(290, 160) rotate(18)">
      <path d="M-10,-5 L28,0 L-10,5 L-2,0 Z" fill="#ffffff" filter="url(#glow)" />
      <!-- Wing trail -->
      <path d="M-60,0 Q -25,-2 -2,0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>
  </g>

  <!-- Brand Typography "Kilotravel" small aesthetic mark -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="2" text-anchor="middle" opacity="0.95">
    KILOTRAVEL
  </text>
</svg>
